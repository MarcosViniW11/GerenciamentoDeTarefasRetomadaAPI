<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Gerenciamento de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <main class="auth-shell">
        <section class="auth-panel">
            <header class="auth-header">
                <p class="eyebrow">Bem-vindo de volta</p>
                <h1>Faça login para continuar</h1>
                <p class="subtitle">Acesse suas tarefas e organize o seu dia com facilidade.</p>
            </header>

            <form id="form-login" class="auth-form" novalidate>
                <div class="field-group">
                    <label for="email-id">E-mail</label>
                    <input type="email" id="email-id" placeholder="seu@email.com" required>
                </div>

                <div class="field-group">
                    <label for="senha-id">Senha</label>
                    <div class="password-row">
                        <input type="password" id="senha-id" placeholder="Digite sua senha" required>
                        <button type="button" class="icon-button" id="btnToggle"
                            aria-label="Alternar visibilidade da senha">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="primary-button">Entrar</button>
                </div>

                <p id="message" class="message" aria-live="polite"></p>
            </form>

            <p class="auth-helper">Não possui cadastro? <a href="authCadastro.html">Crie sua conta</a></p>
        </section>
    </main>

    <footer class="page-footer">
        <p>Feito por Marcos Rocha</p>
    </footer>
    <script src="login.js"></script>
</body>

</html>
